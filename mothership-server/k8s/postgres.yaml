apiVersion: v1
kind: Service
metadata:
  name: mothership-db
spec:
  ports:
    - port: 5432
  selector:
    app: mothership-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mothership-db
spec:
  serviceName: "mothership-db"
  replicas: 1
  selector:
    matchLabels:
      app: mothership-db
  template:
    metadata:
      labels:
        app: mothership-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: "password"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: pg-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
