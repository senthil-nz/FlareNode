apiVersion: v1
kind: Service
metadata:
  name: mothership-api
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: mothership-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mothership-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mothership-api
  template:
    metadata:
      labels:
        app: mothership-api
    spec:
      containers:
      - name: api
        image: mothership-api:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: mothership-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
